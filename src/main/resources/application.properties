spring.application.name=pearlgrey

# Default to the local profile for developer runs (uses in-memory H2)
spring.profiles.active=local

### JWT (shared across profiles)
app.jwt.secret=ReplaceWithARealSecretKeyChangeMe123
app.jwt.expiration-ms=86400000

### Default admin (created on first run if no admins exist)
app.admin.username=admin
app.admin.password=admin
