spring.datasource.url=jdbc:h2:mem:pearlgrey;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JWT - reuse defaults from main properties
app.jwt.secret=ReplaceWithARealSecretKeyChangeMe123
app.jwt.expiration-ms=86400000

# Default admin
app.admin.username=admin
app.admin.password=admin

# CORS - allowed origins for frontend
app.cors.allowed-origins=http://localhost:8080
